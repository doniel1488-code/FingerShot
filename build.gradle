plugins {
    id 'fabric-loom' version '1.11.8'
}

version = '0.1.0'
group = 'io.github.doniel1488.fingershot'

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        fingershot {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.8'
    mappings 'net.fabricmc:yarn:1.21.8+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.136.1+1.21.8'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
test { useJUnitPlatform() }
jar { from('LICENSE') { rename { 'LICENSE_fingershot' } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'fingershot-gametest'
        eula = true
    }
}
