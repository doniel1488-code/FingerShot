# Максимальный размер загружаемого файла.
max-download-mb: 25

# Максимальная дистанция, на которой команда находит рамку.
target-distance: 8.0

# Путь к FFmpeg. Можно указать полный путь к исполняемому файлу.
ffmpeg-path: ffmpeg

# Путь к yt-dlp. Нужен для ссылок на YouTube.
yt-dlp-path: yt-dlp

# Частота кадров видео на карте. Реальное обновление ограничено частотой отправки map-пакетов Minecraft.
video-fps: 6

# Ограничение длительности и числа кадров одного ролика.
max-video-seconds: 30
max-video-frames: 180

# Ограничение числа кадров GIF.
max-image-frames: 120