# Версия конфига (служебная настройка).
config-version: 2

# Максимальный размер загружаемого медиафайла.
max-download-mb: 25

# Максимальная дистанция, на которой команда находит верхнюю левую рамку сетки.
target-distance: 8.0

# Пути к инструментам. Если они не найдены в PATH или по указанному пути,
# плагин автоматически загрузит подходящие Linux-бинарники в plugins/GovernixMediaFrame/bin.
# Вручную устанавливать FFmpeg, yt-dlp или Deno больше не требуется.
ffmpeg-path: ffmpeg
yt-dlp-path: yt-dlp
deno-path: deno

# Необязательно: Netscape cookies.txt из браузера, если YouTube просит подтвердить вход.
# Положи файл в plugins/GovernixMediaFrame/cookies.txt. Оставь cookies.txt, если файл будет создан.
youtube-cookies-file: cookies.txt

# Частота кадров видео. Bukkit MapRenderer ограничен игровым циклом сервера (до 20 FPS при 20 TPS).
video-fps: 20

# Ограничение длительности и числа кадров одного ролика.
max-video-seconds: 30
max-video-frames: 180

# Ограничение числа кадров GIF.
max-image-frames: 120

# Максимальный размер экрана — 25 рамок (5x5).
# Каждый блок использует карту 128x128; лимит памяти декодирования кадров — 128 MiB.
