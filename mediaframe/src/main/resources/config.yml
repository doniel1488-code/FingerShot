# Максимальный размер загружаемого медиафайла.
max-download-mb: 25

# Максимальная дистанция, на которой команда находит рамку.
target-distance: 8.0

# Пути к инструментам. Если они не найдены в PATH или по указанному пути,
# плагин автоматически загрузит подходящие Linux-бинарники в plugins/GovernixMediaFrame/bin.
# Вручную устанавливать FFmpeg, yt-dlp или Deno больше не требуется.
ffmpeg-path: ffmpeg
yt-dlp-path: yt-dlp
deno-path: deno

# Частота кадров видео на карте. Реальное обновление ограничено map-пакетами Minecraft.
video-fps: 6

# Ограничение длительности и числа кадров одного ролика.
max-video-seconds: 30
max-video-frames: 180

# Ограничение числа кадров GIF.
max-image-frames: 120
