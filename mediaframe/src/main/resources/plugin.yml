name: GovernixMediaFrame
version: 1.3.1
main: ru.governix.mediaframe.MediaFramePlugin
api-version: '1.21'
description: Displays images and videos on Minecraft item-frame maps.
author: GOVERNIX
commands:
  mediaframe:
    description: Display media across a rectangular grid of item frames.
    usage: /mediaframe <url> [widthxheight]
    aliases: [mf]
    permission: mediaframe.use
permissions:
  mediaframe.use:
    description: Allows using media frames.
    default: op