name: Build Mahoraga & Yuji (Fabric 1.21.8)

on:
  push:
    branches:
      - feature/mahoraga-yuji-1.21.8
    paths:
      - 'mahoraga-yuji/**'
      - '.github/workflows/mahoraga-yuji.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build mod
        run: ./gradlew --no-daemon --console=plain -p mahoraga-yuji clean build
      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mahoraga-yuji-fabric-1.21.8
          path: mahoraga-yuji/build/libs/mahoyu-*.jar
          if-no-files-found: error
