name: GovernixMediaFrame Paper 1.21.11

on:
  push:
    paths:
      - 'mediaframe/**'
      - '.github/workflows/mediaframe-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Paper 1.21.11 plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mediaframe/pom.xml
      - name: Build JAR
        working-directory: mediaframe
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GovernixMediaFrame-Paper-1.21.11
          path: mediaframe/target/GovernixMediaFrame-1.0.0-Paper-1.21.11.jar
          if-no-files-found: error
          retention-days: 30
