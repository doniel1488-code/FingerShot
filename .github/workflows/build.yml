name: Build FingerShot

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: fingershot-fabric
          path: build/libs/fingershot-*.jar
          if-no-files-found: error
      - name: Install Minecraft narrator library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flite1-dev
      - name: Run Minecraft client smoke test
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          FINGERSHOT_CAPTURE_DIR: ${{ github.workspace }}/build/fingershot-captures
        run: xvfb-run -a ./gradlew runClientGameTest
      - name: Upload gameplay captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fingershot-gameplay
          path: build/fingershot-captures/fingershot-*.png
          if-no-files-found: error
